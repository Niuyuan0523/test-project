<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5.20 快乐 | 致最特别的你</title>
    <style>
        /* 浪漫渐变背景 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffb3c6 100%);
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
        }

        /* 飘落爱心样式 */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: fall linear infinite;
            opacity: 0.8;
            user-select: none;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 主页卡片 */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            text-align: center;
            max-width: 400px;
            width: 80%;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.3);
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 20px;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        p {
            color: #590d22;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* 点击产生的心碎/绽放特效 */
        .click-heart {
            position: absolute;
            color: #ff758f;
            pointer-events: none;
            font-size: 24px;
            animation: burst 0.8s ease-out forwards;
        }

        @keyframes burst {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0);
                opacity: 0;
            }
        }

        /* 底部浪漫小字 */
        .footer {
            position: absolute;
            bottom: 20px;
            color: #ff758f;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card" id="loveCard">
        <h1>5.20 💗 快 乐</h1>
        <p id="text">
            “在这个充满爱意的日子里，<br>
            想把世界上所有的温柔都送给你。<br>
            春赏百花秋望月，<br>
            而我的眼里，只有你。”
        </p>
        <p style="font-size: 0.9rem; color: #ff758f;">( 点击卡片，收获满满爱意 )</p>
    </div>

    <div class="footer">Today and Everyday • I Love You</div>

    <script>
        // 自动生成飘落的爱心
        function createFallingHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            // 随机大小、位置、速度
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's'; // 3-6秒
            const size = Math.random() * 15 + 15; // 15-30px
            heart.style.fontSize = size + 'px';
            
            document.body.appendChild(heart);

            // 动画结束后移除
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // 定时生成飘落爱心
        setInterval(createFallingHeart, 300);

        // 点击卡片爆发出小爱心
        const card = document.getElementById('loveCard');
        const phrases = [
            "“遇见你，是银河赠予我的糖。”",
            "“你的眼睛眨一下，我就心动一次。”",
            "“今天520，明天的我也同样爱你。”",
            "“你是我所有浪漫的定义。”",
            "“山水一程，三生有幸。”"
        ];
        let phraseIndex = 0;

        card.addEventListener('click', (e) => {
            // 点击时切换文案
            phraseIndex = (phraseIndex + 1) % phrases.length;
            document.getElementById('text').innerHTML = phrases[phraseIndex];

            // 爆发出8个方向的爱心
            for (let i = 0; i < 8; i++) {
                const burstHeart = document.createElement('div');
                burstHeart.classList.add('click-heart');
                burstHeart.innerHTML = '💖';
                
                // 设置在点击位置
                burstHeart.style.left = e.clientX + 'px';
                burstHeart.style.top = e.clientY + 'px';
                
                // 随机散射方向
                const angle = (i * 45) * Math.PI / 180;
                const distance = Math.random() * 60 + 40;
                const x = Math.cos(angle) * distance + 'px';
                const y = Math.sin(angle) * distance + 'px';
                
                burstHeart.style.setProperty('--x', x);
                burstHeart.style.setProperty('--y', y);
                
                document.body.appendChild(burstHeart);
                
                setTimeout(() => {
                    burstHeart.remove();
                }, 800);
            }
        });
    </script>
</body>
</html>
